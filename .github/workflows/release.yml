name: Release

# 打 tag(v*) 触发:构建 Linux 包(AppImage/deb)并发布到 GitHub Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖(Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 质量门禁(与 CI 一致)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: 构建前端
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 构建发布包(AppImage/deb)
        working-directory: app
        run: pnpm tauri build

      - name: 收集产物
        run: |
          mkdir -p dist
          find app/src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} dist/ \;
          find app/src-tauri/target/release/bundle -name "*.deb" -exec cp {} dist/ \;
          ls -la dist/

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物(workflow_dispatch 手动触发时)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
